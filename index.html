<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шаурма Rock & Roll</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Фонова анімація -->
  <div class="background-animation"></div>

  <!-- Меню та пошук -->
  <header>
    <div class="logo">Шаурма Rock & Roll</div>
    <input type="text" id="search" placeholder="Пошук шаурми...">
  </header>

  <!-- Основний контент -->
  <main>
    <section class="menu">
      <h2>Наше меню</h2>
      <div class="product">
        <img src="shawarma1.jpg" alt="Шаурма">
        <h3>Шаурма класична</h3>
        <p>Текст опису шаурми...</p>
        <button class="add-to-cart">Додати до кошика</button>
      </div>
      <!-- Додаткові продукти -->
    </section>

    <!-- Корзина -->
    <div id="cart">
      <h3>Ваша корзина</h3>
      <ul id="cart-items">
        <!-- Продукти в корзині будуть додаватися сюди -->
      </ul>
      <button id="checkout">Оформити замовлення</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Шаурма Rock & Roll</p>
  </footer>
</body>
</html>
